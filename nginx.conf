events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format loadbalancer_log '$remote_addr - real_ip=$http_x_real_ip xff="$http_x_forwarded_for" '
                                '[$time_local] "$request" $status upstream=$upstream_addr';

    access_log /var/log/nginx/access.log loadbalancer_log;

    upstream granjaweb_nodes {
        server no1:80;
        server no2:80;
        server no3:80;
        server no4:80;
        server no5:80;
    }

    include /etc/nginx/conf.d/*.conf;
}